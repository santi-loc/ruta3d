name: Actualizar catálogos

on:
  schedule:
    # Todos los días a las 08:00 UTC (05:00 en Argentina durante UTC-3).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run refresh:catalog
        env:
          CATALOG_REFRESH_CONCURRENCY: 4
          CATALOG_REFRESH_TIMEOUT_MS: 480000

      - name: Guardar catálogos actualizados
        run: |
          git config user.name "filtrar-3d-bot"
          git config user.email "actions@github.com"
          git add data/*-products.json data/catalog-refresh.json
          git diff --cached --quiet || git commit -m "chore: actualizar catálogos"
          git push origin HEAD:${GITHUB_REF_NAME}
